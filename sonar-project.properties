# The scan runs at the repo root after `mise run check:ci`, which writes the reports named below.
# Every path here is from the repo root.
sonar.projectKey=artel-collector

sonar.sources=src
sonar.tests=src,tests
# Test files and the test helpers in tests/ are test code. A file indexed as both a source and a test fails the scan,
# so they leave the sources.
sonar.exclusions=**/*.test.ts,tests/**
sonar.test.inclusions=**/*.test.ts,tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml
